name: CI

on:
  push:
    branches: [main]
  # No branch filter: a pull request stacked on another branch still has to be
  # verified before it merges. Restricting to `main` silently gave stacked
  # pull requests no checks at all, which reads as "nothing to see" rather than
  # "never ran".
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"

jobs:
  ci:
    name: Check / Typecheck / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm knip
      # The LSP typechecks against nestjs-doctor's built .d.mts, so build first.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter nestjs-doctor smoke:packed
      # Only the built bundle shows whether the server still pulls the
      # analyzer in, which no unit test importing src can see.
      - run: pnpm --filter nestjs-doctor-lsp smoke:bundle
      # The extension hand-copies the two LSP bundles and wires itself to
      # its manifest by string, both of which fail silently.
      - run: pnpm --filter nestjs-doctor-vscode verify:package

  test:
    # The scanner normalises paths, shells out to git, and resolves tsconfig
    # aliases — all of which behave differently on Windows. Node 20 is the
    # oldest release the package supports.
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
