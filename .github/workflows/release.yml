name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance: the publish exchanges this OIDC token for a
  # signed attestation tying each tarball to this workflow and commit.
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
          version-script: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Keep the action release marked as latest
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '[.[] | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.created_at) | last | .tag_name')"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No action release exists; leaving latest alone."
            exit 0
          fi
          rid="$(gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq .id)"
          gh api -X PATCH "repos/${{ github.repository }}/releases/$rid" -f make_latest=true > /dev/null
          echo "Marked $tag as the latest release."

  publish-vscode:
    name: Publish VS Code Extension
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter nestjs-doctor-lsp build
      - run: pnpm --filter nestjs-doctor-vscode build
      - name: Check whether the marketplace already has this version
        id: marketplace
        run: |
          set -euo pipefail
          local_version="$(node -p "require('./packages/nestjs-doctor-vscode/package.json').version")"
          published="$(curl -sS --max-time 30 -X POST \
            "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json;api-version=3.0-preview.1" \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"rolobits.nestjs-doctor-vscode"}]}],"flags":1}' \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).results[0].extensions[0]?.versions[0]?.version ?? ''")"
          echo "local=$local_version marketplace=$published"
          if [ "$local_version" = "$published" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to VS Code Marketplace
        if: steps.marketplace.outputs.publish == 'true'
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          packagePath: packages/nestjs-doctor-vscode
          dependencies: false
          skipDuplicate: true
